name: Build Seestar AstroLab AAVSO (Windows)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-seestar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression-tests:
    name: "Mandatory Pre-Build Autotests (8-Lang, Coords, Updater, UI, Live Radar)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright Chromium & test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install certifi playwright pyyaml
          python -m playwright install chromium

      - name: Run all 7 mandatory pre-build regression autotests
        env:
          PYTHONUTF8: '1'
        run: |
          python tests/run_localization_autotest.py
          python tests/run_coord_reconciliation_autotest.py
          python tests/run_update_checker_autotest.py
          python tests/run_ui_and_guides_v132_autotest.py
          python tests/run_live_radar_v133_autotest.py
          python tests/run_perf_and_e2e_v135_autotest.py
          python tests/run_light_curve_lab_v140_autotest.py

  build-windows:
    name: Build & Publish Windows Installer
    needs: regression-tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies & verify installer assets
        working-directory: Source_and_Build
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview pythonnet clr-loader pillow certifi
          python -c "import os; from PIL import Image, ImageDraw; os.makedirs('assets', exist_ok=True); ico='assets/Seestar_AstroLab.ico'; bmp='assets/installer_header_fullwidth.bmp'; (lambda: (img:=Image.new('RGBA',(256,256),(11,18,32,255)), d:=ImageDraw.Draw(img), d.ellipse((16,16,240,240),outline=(56,189,248,255),width=10), d.ellipse((44,44,212,212),outline=(129,140,248,230),width=6), d.ellipse((86,86,170,170),fill=(15,23,42,255),outline=(186,230,253,255),width=5), d.ellipse((114,114,142,142),fill=(56,189,248,255)), img.save(ico,format='ICO',sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])))() if not os.path.isfile(ico) else None; (lambda: (b:=Image.new('RGB',(500,160),(11,18,32)), bd:=ImageDraw.Draw(b), [bd.line([(x,0),(x,160)],fill=(int(11+(x/500)*18),int(18+(x/500)*28),int(32+(x/500)*48))) for x in range(500)], bd.ellipse((370,20,490,140),outline=(56,189,248),width=4), b.save(bmp,format='BMP')))() if not os.path.isfile(bmp) else None"

      - name: Build standalone application binary with PyInstaller
        working-directory: Source_and_Build
        shell: pwsh
        run: |
          # Uses --console instead of --windowed to prevent pythonw.exe launcher failures
          $argsList = @(
            "--noconfirm", "--clean", "--onefile", "--console", "--noupx",
            "--name", "Seestar AstroLab",
            "--version-file", "version_info.txt",
            "--collect-all", "webview",
            "--collect-all", "pythonnet",
            "--collect-all", "clr_loader",
            "--collect-all", "certifi",
            "--hidden-import", "webview.platforms.edgechromium"
          )
          if (Test-Path "pwa_mobile_and_electron") { $argsList += @("--add-data", "pwa_mobile_and_electron;pwa_mobile_and_electron") }
          if (Test-Path "backend") { $argsList += @("--add-data", "backend;backend") }
          if (Test-Path "desktop_pc") { $argsList += @("--add-data", "desktop_pc;desktop_pc") }
          if (Test-Path "Converted_Photometry_Storage") { $argsList += @("--add-data", "Converted_Photometry_Storage;Converted_Photometry_Storage") }
          if (Test-Path "../Converted_Photometry_Storage") { $argsList += @("--add-data", "../Converted_Photometry_Storage;Converted_Photometry_Storage") }
          if (Test-Path "assets/Seestar_AstroLab.ico") { $argsList += @("--icon", "assets/Seestar_AstroLab.ico") }
          $argsList += "--exclude-module"
          $argsList += "tkinter"
          $argsList += "desktop_launcher.py"
          pyinstaller @argsList
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare Authenticode Code Signing Certificate (optional)
        working-directory: Source_and_Build
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force -Path "dist_installer" | Out-Null
          if ($env:CODESIGN_PFX_BASE64) {
            $pfxPath = "$PWD\dist_installer\CosmoBehemothych_CodeSign.pfx"
            $pwdPlain = if ($env:CODESIGN_PFX_PASSWORD) { $env:CODESIGN_PFX_PASSWORD } else { "" }
            $secPwd = ConvertTo-SecureString -String $pwdPlain -Force -AsPlainText
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
            $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\CurrentUser\My" -Password $secPwd -Exportable
            "CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            Write-Host "No code signing certificate provided. Skipping signing."
          }

      - name: Sign Application Binary (if certificate available)
        working-directory: Source_and_Build
        shell: pwsh
        run: |
          if (-not $env:CERT_THUMBPRINT) { Write-Host "Skipping: no certificate."; exit 0 }
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1 -ExpandProperty FullName
          $appExe = "$PWD\dist\Seestar AstroLab.exe"
          if ($signtool -and (Test-Path $appExe)) {
            & $signtool sign /fd SHA256 /sha1 $env:CERT_THUMBPRINT /tr "http://timestamp.digicert.com" /td SHA256 /d "Seestar AstroLab AAVSO" $appExe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build Standalone Windows Installer (Inno Setup 6)
        working-directory: Source_and_Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "assets" | Out-Null
          if (-not (Test-Path "assets\installer_header_fullwidth.bmp")) {
            python -c "from PIL import Image, ImageDraw; b = Image.new('RGB', (500,160), (11,18,32)); bd = ImageDraw.Draw(b); [bd.line([(x,0),(x,160)], fill=(int(11+(x/500)*18), int(18+(x/500)*28), int(32+(x/500)*48))) for x in range(500)]; bd.ellipse((370,20,490,140), outline=(56,189,248), width=4); b.save('assets/installer_header_fullwidth.bmp', format='BMP')"
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y }
          & $iscc ".\Seestar_AstroLab_Installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign Standalone Installer (if certificate available)
        working-directory: Source_and_Build
        shell: pwsh
        run: |
          if (-not $env:CERT_THUMBPRINT) { Write-Host "Skipping: no certificate."; exit 0 }
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1 -ExpandProperty FullName
          $setupExe = "$PWD\dist_installer\Seestar_AstroLab_Setup_v1.4.0.exe"
          if ($signtool -and (Test-Path $setupExe)) {
            & $signtool sign /fd SHA256 /sha1 $env:CERT_THUMBPRINT /tr "http://timestamp.digicert.com" /td SHA256 /d "Seestar AstroLab AAVSO Setup" $setupExe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Remove-Item -Path "$PWD\dist_installer\CosmoBehemothych_CodeSign.pfx" -Force -ErrorAction SilentlyContinue

      - name: Generate SHA-256 Checksums & Bundle VERIFY.txt
        working-directory: Source_and_Build
        shell: pwsh
        run: |
          $setupFile = "dist_installer/Seestar_AstroLab_Setup_v1.4.0.exe"
          $hash = (Get-FileHash -Path $setupFile -Algorithm SHA256).Hash.ToLower()
          "$hash  Seestar_AstroLab_Setup_v1.4.0.exe" | Out-File -FilePath "dist_installer/SHA256SUMS.txt" -Encoding ascii -NoNewline
          "`n" | Out-File -FilePath "dist_installer/SHA256SUMS.txt" -Encoding ascii -Append -NoNewline
          if (Test-Path "../VERIFY.txt") {
            Copy-Item "../VERIFY.txt" "dist_installer/VERIFY.txt" -Force
          }
          "SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "SHA256(Seestar_AstroLab_Setup_v1.4.0.exe) = $hash"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Seestar_AstroLab_Windows_Installer
          path: Source_and_Build/dist_installer/*
          if-no-files-found: error

      - name: Publish Release Assets on Tag Push
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not ($tag -match "^v\d")) { $tag = "v1.4.0" }

          $files = @(
            "Source_and_Build/dist_installer/Seestar_AstroLab_Setup_v1.4.0.exe",
            "Source_and_Build/dist_installer/SHA256SUMS.txt",
            "Source_and_Build/dist_installer/VERIFY.txt"
          )

          $notes = @"
          ### Windows Installer Only
          Starting with ``$tag``, Seestar AstroLab AAVSO is distributed exclusively as a standalone Windows Installer (``Seestar_AstroLab_Setup_v1.4.0.exe``). Portable builds are discontinued.

          ### Release Integrity (SHA-256)
          ``````text
          $($env:SETUP_SHA256)  Seestar_AstroLab_Setup_v1.4.0.exe
          ``````

          Verify on Windows PowerShell before running:
          ``````powershell
          Get-FileHash .\Seestar_AstroLab_Setup_v1.4.0.exe -Algorithm SHA256
          ``````
          See ``VERIFY.txt``, [SECURITY.md](https://github.com/CosmoBehemothych/Seestar-AstroLab-AAVSO/blob/main/SECURITY.md), and [BUILD.md](https://github.com/CosmoBehemothych/Seestar-AstroLab-AAVSO/blob/main/BUILD.md) for independent verification and reproducible build steps.
          "@

          gh release delete $tag --yes 2>$null
          $preArgs = @()
          if ($tag -match "-(alpha|beta|rc)") { $preArgs += "--prerelease" }
          gh release create $tag $files --draft @preArgs --title "Seestar AstroLab AAVSO $tag" --notes $notes --generate-notes
          gh release edit $tag --draft=false @preArgs
