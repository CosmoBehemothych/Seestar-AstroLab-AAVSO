name: Build and Release Seestar AstroLab Windows

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Тег релиза для публикации (например, v1.1.2-beta)"
        required: false
        default: "v1.1.2-beta"

permissions:
  contents: write

env:
  APP_NAME: "Seestar AstroLab"
  APP_VERSION: "1.1.2-beta"
  APP_VERSION_DISPLAY: "1.1.2 beta"
  DEFAULT_TAG: "v1.1.2-beta"
  PYTHONUTF8: "1"

jobs:
  build-windows:
    name: Build Single-File EXE, Inno Setup & Publish Release (v1.1.2 beta)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build and runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install pyinstaller>=6.0.0 pywebview>=5.0 pythonnet>=3.0.3 clr-loader>=0.2.6 bottle proxy_tools typing_extensions pillow
          if (Test-Path "Source_and_Build/requirements.txt") {
              pip install -r "Source_and_Build/requirements.txt"
          }

      - name: Build single-file EXE with PyInstaller (AV-safe --onefile --windowed --noupx)
        shell: pwsh
        working-directory: Source_and_Build
        run: |
          Write-Host "=== Сборка единичного файла Seestar AstroLab.exe (v$env:APP_VERSION_DISPLAY) ===" -ForegroundColor Cyan

          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist" }
          if (Test-Path "dist_installer") { Remove-Item -Recurse -Force "dist_installer" }
          New-Item -ItemType Directory -Force -Path "dist_installer" | Out-Null

          $pyiArgs = @(
              "--noconfirm",
              "--clean",
              "--onefile",
              "--windowed",
              "--noupx",
              "--name", "Seestar AstroLab",
              "--collect-all", "webview",
              "--collect-all", "pythonnet",
              "--collect-all", "clr_loader",
              "--hidden-import", "webview.platforms.edgechromium",
              "--hidden-import", "webview.platforms.winforms",
              "--hidden-import", "bottle",
              "--hidden-import", "clr"
          )

          if (Test-Path "assets/Seestar_AstroLab.ico") {
              $pyiArgs += @("--icon", "assets/Seestar_AstroLab.ico")
              $pyiArgs += @("--add-data", "assets;assets")
          } elseif (Test-Path "Seestar_AstroLab.ico") {
              $pyiArgs += @("--icon", "Seestar_AstroLab.ico")
              $pyiArgs += @("--add-data", "Seestar_AstroLab.ico;.")
          }

          if (Test-Path "version_info.txt") {
              $pyiArgs += @("--version-file", "version_info.txt")
          }

          if (Test-Path "pwa_mobile_and_electron") {
              $pyiArgs += @("--add-data", "pwa_mobile_and_electron;pwa_mobile_and_electron")
          }

          if (Test-Path "backend") {
              $pyiArgs += @("--add-data", "backend;backend")
          }

          if (Test-Path "desktop_pc") {
              $pyiArgs += @("--add-data", "desktop_pc;desktop_pc")
          }

          if (Test-Path "docs") {
              $pyiArgs += @("--add-data", "docs;docs")
          }

          if (Test-Path "../Converted_Photometry_Storage") {
              $pyiArgs += @("--add-data", "../Converted_Photometry_Storage;Converted_Photometry_Storage")
          }

          $pyiArgs += "desktop_launcher.py"

          Write-Host "Выполняется: pyinstaller $($pyiArgs -join ' ')" -ForegroundColor Yellow
          pyinstaller @pyiArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not (Test-Path "dist/Seestar AstroLab.exe")) {
              Write-Error "КРИТИЧЕСКАЯ ОШИБКА: dist/Seestar AstroLab.exe не создан!"
              exit 1
          }

      - name: Sign EXE and Compile Inno Setup 6 Installer
        shell: pwsh
        working-directory: Source_and_Build
        run: |
          Write-Host "=== Генерация сертификата издателя CosmoBehemothych и сборка Inno Setup 6 ===" -ForegroundColor Cyan

          # Создаём сертификат издателя CosmoBehemothych для подписи .exe (чтобы BAT-скрипт мог добавить его в TrustedPublisher)
          $cert = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject "CN=CosmoBehemothych, O=CosmoBehemothych AstroLab, C=RU" `
              -KeyAlgorithm RSA `
              -KeyLength 2048 `
              -HashAlgorithm "SHA256" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -NotAfter (Get-Date).AddYears(5)

          Set-AuthenticodeSignature -FilePath "dist/Seestar AstroLab.exe" -Certificate $cert -HashAlgorithm SHA256 | Out-Null

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
              choco install innosetup -y --no-progress
          }
          & $iscc "Seestar_AstroLab_Installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $setupExe = "dist_installer/Seestar_AstroLab_Setup_v$($env:APP_VERSION).exe"
          if (Test-Path $setupExe) {
              Set-AuthenticodeSignature -FilePath $setupExe -Certificate $cert -HashAlgorithm SHA256 | Out-Null
          }

          # Копируем BAT-файл обхода SmartScreen в dist_installer
          if (Test-Path "../Run_Setup_Without_SmartScreen_Warning.bat") {
              Copy-Item "../Run_Setup_Without_SmartScreen_Warning.bat" -Destination "dist_installer/Run_Setup_Without_SmartScreen_Warning.bat" -Force
          } elseif (Test-Path "Run_Setup_Without_SmartScreen_Warning.bat") {
              Copy-Item "Run_Setup_Without_SmartScreen_Warning.bat" -Destination "dist_installer/Run_Setup_Without_SmartScreen_Warning.bat" -Force
          }

          # Упаковываем единичный Portable EXE + BAT-помощник в ZIP-архив
          $portableStage = "dist/Portable_Single"
          New-Item -ItemType Directory -Force -Path $portableStage | Out-Null
          Copy-Item "dist/Seestar AstroLab.exe" -Destination "$portableStage/Seestar_AstroLab_Portable_v$($env:APP_VERSION).exe" -Force
          if (Test-Path "dist_installer/Run_Setup_Without_SmartScreen_Warning.bat") {
              Copy-Item "dist_installer/Run_Setup_Without_SmartScreen_Warning.bat" -Destination "$portableStage/Run_Setup_Without_SmartScreen_Warning.bat" -Force
          }
          if (Test-Path "../LICENSE") {
              Copy-Item "../LICENSE" -Destination "$portableStage/LICENSE" -Force
          }
          if (Test-Path "../README.md") {
              Copy-Item "../README.md" -Destination "$portableStage/README.md" -Force
          }

          $zipPath = "dist_installer/Seestar_AstroLab_Portable_v$($env:APP_VERSION).zip"
          Compress-Archive -Path "$portableStage/*" -DestinationPath $zipPath -Force

          Get-ChildItem -Path "dist_installer" | Format-Table Name, Length, LastWriteTime -AutoSize

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Seestar_AstroLab_Windows_v1.1.2-beta
          path: |
            Source_and_Build/dist_installer/*.exe
            Source_and_Build/dist_installer/*.zip
            Source_and_Build/dist_installer/*.bat
          if-no-files-found: error

      - name: Publish Release via GitHub CLI (Draft -> Upload -> Publish)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "=== Публикация релиза через GitHub CLI (обход Immutable Releases) ===" -ForegroundColor Cyan

          if ($env:GITHUB_REF -like "refs/tags/*") {
              $tag = $env:GITHUB_REF_NAME
          } elseif ("${{ github.event.inputs.release_tag }}" -ne "") {
              $tag = "${{ github.event.inputs.release_tag }}"
          } else {
              $tag = $env:DEFAULT_TAG
          }

          $installerDir = "Source_and_Build/dist_installer"
          $fileItems = @()
          $fileItems += Get-ChildItem -Path $installerDir -Filter "*.exe" -File -ErrorAction SilentlyContinue
          $fileItems += Get-ChildItem -Path $installerDir -Filter "*.zip" -File -ErrorAction SilentlyContinue
          $fileItems += Get-ChildItem -Path $installerDir -Filter "*.bat" -File -ErrorAction SilentlyContinue

          if ($fileItems.Count -eq 0) {
              Write-Error "В папке $installerDir нет файлов для публикации релиза!"
              exit 1
          }

          $files = $fileItems | ForEach-Object { $_.FullName }
          Write-Host "Целевой тег: $tag. Файлы релиза:" -ForegroundColor Yellow
          $files | ForEach-Object { Write-Host "  -> $_" }

          # 1. Удаляем старый релиз для этого тега (если он есть), чтобы обойти блокировку Immutable Releases
          gh release delete $tag --yes 2>$null
          if ($LASTEXITCODE -ne 0) {
              Write-Host "Старый релиз $tag не существовал, создаём новый." -ForegroundColor Gray
          }

          # 2. Создаём черновик (draft) и загружаем в него файлы (.exe, .zip, .bat)
          gh release create $tag $files --title "Seestar AstroLab AAVSO v1.1.2 beta" --draft --generate-notes
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Не удалось создать черновик релиза $tag!"
              exit 1
          }

          # 3. Опубликовываем черновик
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Не удалось опубликовать черновик релиза $tag!"
              exit 1
          }

          Write-Host "Релиз $tag успешно опубликован!" -ForegroundColor Green
