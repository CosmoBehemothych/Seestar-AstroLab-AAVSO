name: Build Seestar AstroLab AAVSO (Windows)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview

      - name: Build standalone application binary with PyInstaller
        working-directory: Source_and_Build
        shell: pwsh
        run: |
          $argsList = @(
            "--noconfirm", "--onedir", "--windowed",
            "--name", "Seestar AstroLab",
            "--version-file", "version_info.txt"
          )
          if (Test-Path "pwa_mobile_and_electron") { $argsList += @("--add-data", "pwa_mobile_and_electron;pwa_mobile_and_electron") }
          if (Test-Path "backend") { $argsList += @("--add-data", "backend;backend") }
          if (Test-Path "desktop_pc") { $argsList += @("--add-data", "desktop_pc;desktop_pc") }
          if (Test-Path "Converted_Photometry_Storage") { $argsList += @("--add-data", "Converted_Photometry_Storage;Converted_Photometry_Storage") }
          if (Test-Path "../Converted_Photometry_Storage") { $argsList += @("--add-data", "../Converted_Photometry_Storage;Converted_Photometry_Storage") }
          if (Test-Path "assets/Seestar_AstroLab.ico") { $argsList += @("--icon", "assets/Seestar_AstroLab.ico") }
          $argsList += "desktop_launcher.py"
          pyinstaller @argsList
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Portable Windows Archive (No Python required)
        working-directory: Source_and_Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist_installer" | Out-Null
          Compress-Archive -Path "dist/Seestar AstroLab/*" -DestinationPath "dist_installer/Seestar_AstroLab_Portable_Windows.zip" -Force

      - name: Build Standalone Windows Installer (Inno Setup 6 — No Python required)
        working-directory: Source_and_Build
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y
          }
          & $iscc Seestar_AstroLab_Installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Seestar_AstroLab_Windows_Build
          path: Source_and_Build/dist_installer/*
          if-no-files-found: error

      - name: Publish Release Assets on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Source_and_Build/dist_installer/Seestar_AstroLab_Setup.exe
            Source_and_Build/dist_installer/Seestar_AstroLab_Portable_Windows.zip
          generate_release_notes: true
